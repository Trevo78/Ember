<style>
/* Layout: one phone-width column, three tabs, a fixed bottom bar, full-screen session player on top. Dark-first by design (woodstove at night). */
:root {
  --bg: #1E1A16;
  --surface: #2A241E;
  --tile: #231E19;
  --line: #352D25;
  --line2: #4A3E33;
  --fg: #F4ECE1;
  --muted: #BBAE9C;
  --dim: #A29483;
  --amber: #E8A05A;
  --amber-soft: #F2BE86;
  --amber-deep: #2E241A;
  --amber-line: #4A3826;
  --sage: #A8C098;
  --sand: #EBCB9F;
  --on-amber: #1E1A16;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --grain: radial-gradient(rgba(255, 236, 210, 0.05) 1px, transparent 1.3px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: var(--grain);
  background-size: 5px 5px;
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

#screen {
  max-width: 480px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px calc(110px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
  position: relative;
}
.contour { position: absolute; top: -30px; right: -70px; width: 300px; opacity: 0.15; pointer-events: none; }
.eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.eyebrow.amber { color: var(--amber); }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; position: relative; }
.top h1 { font-size: 40px; letter-spacing: -0.01em; line-height: 1.05; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--amber-deep); border: 1px solid var(--amber-line); color: var(--amber-soft); font-weight: 600; font-size: 14px; white-space: nowrap; }

.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; position: relative; }
.strip span { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
.strip i { width: 100%; height: 4px; border-radius: 2px; background: var(--line); }
.strip .today { color: var(--fg); font-weight: 600; }
.strip .today i { outline: 1px solid var(--amber); outline-offset: 2px; }
.strip .done i { background: var(--amber); }
.strip .skip i { background: var(--line2); }

.card { background: var(--surface); border: 1px solid #3A3129; border-radius: 24px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); position: relative; }
.card h2 { font-size: 32px; line-height: 1.1; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.poses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pose { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--tile); border-radius: 16px; padding: 10px 4px; font-size: 11px; color: #D8CCBB; text-align: center; min-width: 0; }
.pose svg { width: 48px; height: 48px; }
.lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #D8CCBB; }
.lines li { display: flex; gap: 10px; }
.lines b { color: var(--amber); font-weight: 600; min-width: 16px; }
.btns { display: flex; gap: 10px; }
.btn { height: 52px; border-radius: 16px; border: 1px solid var(--line2); background: transparent; padding: 0 18px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { flex: 1; border: 0; background: var(--amber); color: var(--on-amber); font-weight: 600; font-size: 15px; }
.btn.small { height: 40px; border-radius: 12px; padding: 0 14px; font-size: 13px; }
.status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--sage); }
.status.skip { color: var(--muted); }
.link { background: none; border: 0; padding: 6px 0; color: var(--amber-soft); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.section { display: flex; flex-direction: column; gap: 4px; position: relative; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 6px; }
.section-head h3 { font-size: 20px; }
.section-head span { font-size: 13px; color: var(--muted); }
.mini { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.check { width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid #5A4B3D; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; }
.check.on { background: var(--sage); border-color: var(--sage); }
.mini-body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini-body strong { font-weight: 500; font-size: 15px; }
.mini-body small { font-size: 12px; color: var(--muted); }
.mini.done strong { color: var(--dim); text-decoration: line-through; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--amber-line); border-radius: 999px; background: var(--amber-deep); color: var(--amber-soft); font-weight: 600; font-size: 13px; white-space: nowrap; }
.chip.live { background: var(--amber); color: var(--on-amber); border-color: var(--amber); }

/* Week */
.weeknav { display: flex; gap: 8px; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; background: var(--surface); border: 1px solid #3A3129; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.win { display: flex; flex-direction: column; gap: 8px; }
.win-bar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.win-bar i { height: 6px; border-radius: 3px; background: #3A3129; }
.win-bar i.on { background: var(--amber); }
.win-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.rows { display: flex; flex-direction: column; }
.row { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.row-actions { position: absolute; inset: 0 0 0 auto; display: flex; }
.row-actions button { width: 72px; border: 0; font-weight: 600; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.row-actions .a-swap { background: var(--amber); color: var(--on-amber); }
.row-actions .a-skip { background: var(--line2); }
.row-front { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 0; background: var(--bg); background-image: var(--grain); background-size: 5px 5px; transition: transform 0.2s ease; touch-action: pan-y; cursor: pointer; }
.row.open .row-front { transform: translateX(-144px); box-shadow: 8px 0 18px rgba(0, 0, 0, 0.35); }
.row.dragging .row-front { transition: none; }
.dow { width: 40px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
.dow small { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
.dow b { font-family: var(--display); font-weight: 400; font-size: 22px; }
.row.is-today .dow b { color: var(--amber); }
.ico { width: 42px; height: 42px; flex-shrink: 0; border-radius: 13px; background: var(--surface); border: 1px solid #3A3129; display: flex; align-items: center; justify-content: center; color: var(--sand); }
.ico.done { background: var(--sage); border-color: var(--sage); color: var(--on-amber); }
.row-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-text strong { font-weight: 500; font-size: 15px; }
.row-text small { font-size: 12px; color: var(--muted); }
.row-text em { font-style: normal; font-size: 11px; color: var(--amber-soft); }
.weekend { display: flex; align-items: center; gap: 14px; padding: 14px; margin-top: 12px; border: 1px dashed var(--line2); border-radius: 18px; }
.hint { font-size: 12px; color: var(--dim); text-align: center; }

/* Streak */
.chain { display: flex; gap: 10px; overflow-x: auto; }
.chain-days { display: grid; grid-template-rows: repeat(7, 14px); gap: 6px; font-size: 10px; color: var(--dim); line-height: 14px; }
.chain-grid { display: grid; grid-template-rows: repeat(7, 14px); grid-auto-flow: column; grid-auto-columns: 14px; gap: 6px 9px; }
.chain-grid i { width: 14px; height: 14px; border-radius: 4px; background: #3A3129; }
.chain-grid i.wk { background: var(--tile); }
.chain-grid i.part { background: #7A5634; }
.chain-grid i.full { background: var(--amber); }
.chain-grid i.pre { background: transparent; border: 1px solid var(--line); }
.chain-grid i.today { outline: 1px solid var(--amber-soft); outline-offset: 1px; }
.badges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-size: 11px; color: #D8CCBB; }
.badge span { width: 60px; height: 60px; border-radius: 50%; border: 1.5px dashed #5A4B3D; background: var(--tile); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 16px; color: var(--muted); }
.badge.got span { border: 0; background: var(--amber); color: var(--on-amber); }
.mixbar { display: flex; gap: 3px; height: 10px; border-radius: 5px; overflow: hidden; }
.mixbar i { display: block; }
.mixlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 12px; color: #D8CCBB; }
.mixlist span { display: flex; align-items: center; gap: 6px; }
.mixlist i { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.field input { height: 44px; border-radius: 12px; border: 1px solid var(--line2); background: var(--tile); color: var(--fg); padding: 0 12px; font: inherit; font-size: 14px; min-width: 0; }
.settings { gap: 14px; }
.settings p { margin: 0; font-size: 12px; color: var(--dim); }

/* Bottom bar */
#tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#tabs div { width: 100%; max-width: 480px; display: flex; justify-content: space-around; padding: 8px 0 10px; }
#tabs button { background: none; border: 0; min-width: 72px; min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); }
#tabs button[aria-current="page"] { color: var(--amber); font-weight: 600; }

/* Player */
.overlay { position: fixed; inset: 0; z-index: 40; background-color: var(--bg); background-image: var(--grain); background-size: 5px 5px; overflow-y: auto; }
.player { max-width: 480px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.p-top { display: flex; justify-content: space-between; align-items: center; }
.p-clock { font-family: var(--display); font-weight: 300; font-size: 24px; color: #D8CCBB; }
.p-prog { display: flex; flex-direction: column; gap: 8px; }
.p-prog-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 12px; }
.p-bar { height: 6px; border-radius: 3px; background: #3A3129; overflow: hidden; }
.p-bar i { display: block; height: 100%; background: var(--amber); transition: width 0.3s ease; }
.p-now { align-items: center; text-align: center; padding: 26px 20px; }
.p-art { width: 160px; height: 160px; border-radius: 28px; background: var(--tile); display: flex; align-items: center; justify-content: center; }
.p-art svg { width: 128px; height: 128px; animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.p-name { font-size: 30px; }
.p-note { font-size: 14px; color: #D8CCBB; max-width: 34ch; }
.p-big { font-family: var(--display); font-weight: 300; font-size: 64px; line-height: 1; }
.p-big small { font-family: var(--body); font-size: 15px; color: var(--muted); }
.p-side { font-size: 13px; color: var(--amber-soft); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.p-ring { width: 100%; height: 6px; border-radius: 3px; background: #3A3129; overflow: hidden; }
.p-ring i { display: block; height: 100%; background: var(--amber-soft); }
.p-controls { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 10px; width: 100%; }
.p-next h3 { font-size: 18px; margin-bottom: 6px; }
.p-next div { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.p-next div:last-child { border-bottom: 0; }
.p-next svg { width: 32px; height: 32px; flex-shrink: 0; }
.p-next span { flex: 1; min-width: 0; }
.p-next em { font-style: normal; font-size: 12px; color: var(--muted); }
.p-done { flex: 1; justify-content: center; align-items: center; text-align: center; }
.p-done .flame { width: 88px; height: 88px; border-radius: 50%; background: var(--amber-deep); border: 1px solid var(--amber-line); display: flex; align-items: center; justify-content: center; }

/* Sheet + toast */
#sheet { position: fixed; inset: 0; z-index: 60; background: rgba(10, 8, 6, 0.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid #3A3129; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-size: 20px; }
.sheet p { margin: 0; font-size: 13px; color: var(--muted); }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px; border-radius: 16px; border: 1px solid var(--line2); background: var(--tile); }
.opt .ico { width: 38px; height: 38px; }
.opt span { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt small { font-size: 12px; color: var(--muted); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }

@media (prefers-reduced-motion: reduce) {
  .p-art svg { animation: none; }
  .row-front, .p-bar i { transition: none; }
}
</style>

    Q = { key: asAlt ? 'bike' : key, dk: dk, startAt: 0, acc: 0, running: false, altOf: asAlt ? key : null };
    overlay.hidden = false; document.body.style.overflow = 'hidden';
    var lines = s.lines.map(function (l, i) { return '<li><b class="num">' + (i + 1) + '</b>' + esc(l) + '</li>'; }).join('');
    overlay.innerHTML = '<div class="player"><div class="p-top"><button class="iconbtn" data-act="p-close" aria-label="Close">' + icon('close') + '</button><span class="eyebrow">' + (asAlt ? 'Alt for ' + esc(S[key].title) : esc(s.meta.join(' · '))) + '</span></div>' +
      '<section class="card p-now"><span class="ico" style="width:72px;height:72px;border-radius:22px">' + icon(s.cat, 34) + '</span><h2 class="p-name">' + esc(s.title) + '</h2>' +
      '<ul class="lines" style="text-align:left;align-self:stretch">' + lines + '</ul>' + (s.note ? '<p class="p-note">' + esc(s.note) + '</p>' : '') +
      '<div class="p-big num" data-tick="q-time">0:00</div><div class="hint" data-tick="q-sub">Timer is optional</div>' +
      '<div class="btns" style="width:100%"><button class="btn" data-act="q-toggle" data-tick="q-btn" style="flex:1">' + icon('play', 14) + 'Start timer</button></div>' +
      '<div class="btns" style="width:100%"><button class="btn primary" data-act="q-done">Mark done</button></div></section></div>';
    tickUI();
  }
  function qElapsed() { return Q ? (Q.acc + (Q.running ? Date.now() - Q.startAt : 0)) / 1000 : 0; }

  /* ---------- ticker ---------- */
  function setTick(name, fn) { var el = document.querySelector('[data-tick="' + name + '"]'); if (el) fn(el); }
  function tickUI() {
    if (P && !P.done) {
      setTick('p-clock', function (el) { el.textContent = mmss((Date.now() - P.started) / 1000); });
      var s = P.steps[P.idx], secs = stepSecs(s);
      if (secs) {
        var left = P.paused ? P.left : Math.max(0, (P.endAt - Date.now()) / 1000);
        setTick('p-left', function (el) { el.textContent = mmss(Math.ceil(left)); });
        setTick('p-ring', function (el) { el.style.width = Math.min(100, (1 - left / secs) * 100) + '%'; });
      }
    }
    if (Q) {
      var e = qElapsed();
      setTick('q-time', function (el) { el.textContent = mmss(e); });
      var minMark = Q.key === 'walk45' ? 45 * 60 : 0;
      setTick('q-sub', function (el) { el.textContent = Q.running || e ? (minMark && e >= minMark ? '+' + mmss(e - minMark) + ' past 45 min' : (Q.running ? 'Running' : 'Paused')) : 'Timer is optional'; });
    }
    if (state.walk) {
      var w = (Date.now() - state.walk.startAt) / 1000;
      setTick('walk', function (el) { el.textContent = w >= 900 ? '15:00 +' + mmss(w - 900) : mmss(w); });
      setTick('walk-sub', function (el) { el.textContent = w >= 900 ? 'Minimum met. Stop whenever you like.' : mmss(900 - w) + ' to the 15 min minimum'; });
    }
  }
  setInterval(function () { tickPlayer(); tickUI(); }, 250);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (P && !P.done) wake(true); render(); } });

  /* ---------- actions ---------- */
  function logSession(dk, key, minutes, extra) {
    var old = sessionOf(dk); if (old) removeEntry(old);
    var s = S[key] || {};
    addEntry(Object.assign({ type: 'session', date: dk, key: key, status: 'done', minutes: minutes || '', miles: s.miles || '' }, extra || {}));
  }
  function startSession(dk) {
    var d = fromKey(dk), key = actual(d), s = S[key];
    if (s.type === 'player') openPlayer(key, dk, 'session'); else openPlan(key, dk, false);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-tab],[data-act]');
    if (!t) { if (ev.target === sheet) closeSheet(); return; }
    if (t.dataset.tab) { tab = t.dataset.tab; openRow = null; render(); window.scrollTo(0, 0); return; }
    var act = t.dataset.act, dk = t.dataset.date, d = dk ? fromKey(dk) : null;
    switch (act) {
      case 'start': startSession(dk); break;
      case 'alt': openPlan(actual(d), dk, true); break;
      case 'swap': openRow = null; swapSheet(dk); break;
      case 'do-swap':
        state.swaps[dk] = t.dataset.key; queueRow('swap', { date: dk, key: t.dataset.key }); save(); sync();
        closeSheet(); render(); toast('Swapped to ' + S[t.dataset.key].title + '.'); break;
      case 'unswap': delete state.swaps[dk]; queueRow('swap', { date: dk, key: '' }); save(); sync(); render(); break;
      case 'skip': closeSheet(); openRow = null; logSession(dk, actual(d), '', { status: 'skipped', miles: '' }); render(); toast('Skipped. Back at it next time.'); break;
      case 'undo-session': var se = sessionOf(dk); if (se) removeEntry(se); openRow = null; render(); break;
      case 'close-row': openRow = null; render(); break;
      case 'weekend-log': openSheet('<h3>Log a weekend activity</h3><p>Optional, and it all counts toward the 100 miles where it applies.</p>' + WEEKEND_LOG.map(function (k) { return optBtn(k, 'weekend-pick', dk); }).join('')); break;
      case 'weekend-pick': closeSheet(); if (S[t.dataset.key].type === 'player') openPlayer(t.dataset.key, dk, 'session'); else openPlan(t.dataset.key, dk, false); break;
      case 'sheet-close': closeSheet(); break;
      case 'mini-toggle': {
        var tk = keyOf(today()), k = t.dataset.key, m = miniOf(tk, k);
        if (m) removeEntry(m);
        else { if (k === 'walk' && state.walk) state.walk = null; addEntry({ type: 'mini', date: tk, key: k, status: 'done', minutes: k === 'walk' ? 15 : k === 'lift' ? 5 : 6, miles: k === 'walk' ? 0.75 : '' }); }
        render(); break;
      }
      case 'walk-start': unlockAudio(); state.walk = { date: keyOf(today()), startAt: Date.now(), chimed: false }; save(); render(); break;
      case 'walk-stop': {
        var w = state.walk; if (!w) break;
        var mins = Math.round((Date.now() - w.startAt) / 60000); state.walk = null;
        if (mins >= 15) { addEntry({ type: 'mini', date: w.date, key: 'walk', status: 'done', minutes: mins, miles: Math.round(mins / 20 * 100) / 100 }); toast('Walk logged: ' + mins + ' min.'); }
        else { save(); toast(mins + ' min so far. 15 counts toward the streak; start again anytime.'); }
        render(); break;
      }
      case 'back-start': openPlayer(null, keyOf(today()), 'back'); break;
      case 'reroll': { var rk = keyOf(today()); state.reroll[rk] = (state.reroll[rk] || 0) + 1; save(); render(); break; }
      case 'p-close': if (P && !P.done && P.idx > 0) { P.paused = true; renderPlayer(); openSheet('<h3>Leave this session?</h3><p>Progress in this session won’t be saved.</p><button class="btn primary" data-act="p-quit" style="width:100%;flex:none">Leave session</button>'); } else closeOverlay(); break;
      case 'p-quit': closeSheet(); closeOverlay(); break;
      case 'p-next': advance(); break;
      case 'p-prev': enter(Math.max(0, P.idx - 1)); break;
      case 'p-pause':
        if (P.paused) { P.paused = false; P.endAt = Date.now() + P.left * 1000; }
        else { P.left = Math.max(0, (P.endAt - Date.now()) / 1000); P.paused = true; }
        renderPlayer(); break;
      case 'p-save': {
        var minutes = Number(t.dataset.min);
        if (P.mode === 'back') { var ex = miniOf(P.dk, 'back'); if (!ex) addEntry({ type: 'mini', date: P.dk, key: 'back', status: 'done', minutes: minutes }); }
        else logSession(P.dk, P.key, minutes);
        closeOverlay(); render(); toast('Saved.'); break;
      }
      case 'q-toggle':
        if (Q.running) { Q.acc += Date.now() - Q.startAt; Q.running = false; } else { Q.startAt = Date.now(); Q.running = true; wake(true); }
        t.innerHTML = Q.running ? icon('pause', 14) + 'Pause timer' : icon('play', 14) + 'Resume timer'; tickUI(); break;
      case 'q-done': {
        var em = Math.round(qElapsed() / 60);
        logSession(Q.dk, Q.key, em || '', Q.altOf ? { note: 'Alt for ' + S[Q.altOf].title, miles: '' } : null);
        closeOverlay(); render(); toast('Nice work. Logged.'); break;
      }
      case 'wk-prev': weekOffset--; openRow = null; render(); break;
      case 'wk-next': weekOffset++; openRow = null; render(); break;
      case 'save-settings': {
        var u = document.getElementById('set-url').value.trim(), hv = Number(document.getElementById('set-hold').value);
        state.settings.url = u; state.settings.hold = hv >= 5 && hv <= 600 ? Math.round(hv) : 35; save(); sync(); render(); toast('Settings saved.'); break;
      }
      case 'sync-now': if (!state.settings.url) toast('Add your Google Sheet link first.'); else { sync(); toast('Syncing.'); } break;
      case 'restore': restore(); break;
    }
  });

  /* swipe rows on the Week screen */
  var drag = null;
  screen.addEventListener('pointerdown', function (ev) {
    var front = ev.target.closest('.row-front'); if (!front) return;
    var row = front.parentNode;
    drag = { row: row, front: front, x: ev.clientX, y: ev.clientY, dx: 0, base: row.classList.contains('open') ? -144 : 0, moved: false };
  });
  screen.addEventListener('pointermove', function (ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.moved = true; drag.row.classList.add('dragging'); }
    if (drag.moved) { drag.dx = dx; drag.front.style.transform = 'translateX(' + Math.max(-160, Math.min(0, drag.base + dx)) + 'px)'; }
  });
  function endDrag() {
    if (!drag) return;
    var dk = drag.row.dataset.row;
    drag.row.classList.remove('dragging'); drag.front.style.transform = '';
    if (drag.moved) { var pos = drag.base + drag.dx; openRow = pos < -60 ? dk : null; }
    else openRow = openRow === dk ? null : dk;
    drag = null; render();
  }
  screen.addEventListener('pointerup', endDrag);
  screen.addEventListener('pointercancel', function () { if (drag) { drag.row.classList.remove('dragging'); drag.front.style.transform = ''; drag = null; } });
  screen.addEventListener('keydown', function (ev) {
    var front = ev.target.closest && ev.target.closest('.row-front');
    if (front && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); var dk = front.parentNode.dataset.row; openRow = openRow === dk ? null : dk; render(); }
  });

  /* ---------- boot ---------- */
  load();
  if (state.walk && state.walk.date !== keyOf(today())) { state.walk = null; save(); }
  var lastDay = keyOf(today());
  setInterval(function () { var k = keyOf(today()); if (k !== lastDay) { lastDay = k; if (!P && !Q) render(); } }, 60000);
  render();
  sync();
  if (window.EMBER_PWA && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* not available */ } }
})();
</script>
