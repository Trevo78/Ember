<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember Forge</title>

<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: workshop bench. Move library down the left, the program being built on the right, week plan as a second tab. Dark-first, same woodstove palette as Ember. */
:root {
  --bg: #1E1A16;
  --surface: #2A241E;
  --tile: #231E19;
  --line: #352D25;
  --line2: #4A3E33;
  --fg: #F4ECE1;
  --muted: #BBAE9C;
  --dim: #A29483;
  --amber: #E8A05A;
  --amber-soft: #F2BE86;
  --amber-deep: #2E241A;
  --amber-line: #4A3826;
  --sage: #A8C098;
  --danger: #E08A6A;
  --on-amber: #1E1A16;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --grain: radial-gradient(rgba(255, 236, 210, 0.05) 1px, transparent 1.3px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background-color: var(--bg); background-image: var(--grain); background-size: 5px 5px; color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 31; background: var(--bg); }
.bar-in { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 26px; letter-spacing: -0.01em; }
.brand small { display: block; font-size: 12px; color: var(--dim); }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.status.ok i { background: var(--sage); }
.status.warn i { background: var(--amber); }
.btn { height: 38px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; padding: 0 14px; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: #6A5848; }
.btn.primary { border: 0; background: var(--amber); color: var(--on-amber); font-weight: 600; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.danger { border-color: #6B3A2A; color: var(--danger); }
.btn.sm { height: 32px; padding: 0 10px; border-radius: 10px; font-size: 12px; }
.icon-btn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid transparent; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { border-color: var(--line2); color: var(--fg); }
.icon-btn.del:hover { color: var(--danger); border-color: #6B3A2A; }

.help { margin-block: 12px 0; padding: 16px 18px; border-radius: 18px; background: var(--surface); border: 1px solid #3A3129; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
.help ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: #D8CCBB; }
.help h3 { font-size: 18px; }
.help .side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

main.grid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; padding-block: 18px 60px; align-items: start; }
@media (max-width: 860px) { main.grid { grid-template-columns: minmax(0, 1fr); } .lib { position: static !important; max-height: none !important; } .help { grid-template-columns: minmax(0, 1fr); } .help .side { align-items: flex-start; } }

/* Library */
.lib { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 96px); display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid #3A3129; border-radius: 20px; padding: 16px; }
.lib h2 { font-size: 20px; }
.lib-head { display: flex; justify-content: space-between; align-items: baseline; }
.lib-head span { font-size: 12px; color: var(--dim); }
.lib > :not(.cards) { flex-shrink: 0; }
.search { height: 40px; width: 100%; border-radius: 12px; border: 1px solid var(--line2); background: var(--tile); padding: 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 30px; border-radius: 999px; border: 1px solid var(--line2); background: transparent; padding: 0 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: #D8CCBB; }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.cards { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-inline: -4px; padding: 2px 4px 4px; min-height: 120px; }
.card { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 14px; background: var(--tile); border: 1px solid transparent; cursor: grab; }
.card:hover { border-color: var(--line2); }
.card:active { cursor: grabbing; }
.card svg.fig { width: 52px; height: 52px; flex-shrink: 0; display: block; }
.figbtn { padding: 0; border: 0; background: var(--surface); border-radius: 12px; flex-shrink: 0; cursor: zoom-in; line-height: 0; }
.figbtn:hover { outline: 1px solid var(--line2); }
#pv { position: fixed; inset: 0; z-index: 60; background: rgba(10, 8, 6, 0.66); display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.pv { width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid #3A3129; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); }
.pv-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.pv-head h2 { font-size: 28px; }
.pv-views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pv-views figure { margin: 0; background: var(--tile); border-radius: 18px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pv-views svg { width: 100%; height: auto; aspect-ratio: 1; }
.pv-views figcaption { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.pv p { margin: 0; color: #D8CCBB; font-size: 14px; }
.card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card strong { font-weight: 500; font-size: 13px; }
.card small { font-size: 11px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.tag i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.add { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--amber-line); background: var(--amber-deep); color: var(--amber-soft); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
.add:hover { background: var(--amber); color: var(--on-amber); }
.empty { padding: 18px 12px; text-align: center; color: var(--dim); font-size: 13px; }

/* Tabs */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { background: none; border: 0; padding: 10px 6px; margin-right: 14px; color: var(--dim); font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--amber); }

/* Program picker */
.progs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.prog-chip { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2); background: transparent; font-size: 13px; }
.prog-chip i { width: 10px; height: 10px; border-radius: 50%; }
.prog-chip small { color: var(--dim); font-size: 11px; }
.prog-chip[aria-pressed="true"] { background: var(--surface); border-color: var(--amber); }
.prog-chip.new { border-style: dashed; color: var(--amber-soft); }

.editor { background: var(--surface); border: 1px solid #3A3129; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.ed-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.field input, .field select { height: 40px; border-radius: 12px; border: 1px solid var(--line2); background: var(--tile); padding: 0 10px; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 14px; color: var(--fg); }
.field.name { flex: 1 1 240px; }
.field.name input { font-family: var(--display); font-size: 22px; height: 46px; }
.field.small input { width: 92px; }
.ed-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.ed-meta .grow { flex: 1; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid #6B3A2A; background: #2C1F19; font-size: 13px; }

/* Stack */
.stack { display: flex; flex-direction: column; gap: 6px; position: relative; min-height: 60px; }
.row { display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 8px 8px 8px 6px; border-radius: 14px; background: var(--tile); border: 1px solid transparent; position: relative; }
.row.compact { grid-template-columns: 22px minmax(0, 1fr) auto; }
.grip { cursor: grab; color: #6E5E4E; display: flex; justify-content: center; padding: 6px 0; }
.grip:hover { color: var(--muted); }
.row svg.fig { width: 44px; height: 44px; display: block; }
.row .figbtn { background: var(--surface); }
.row .nm { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row .nm strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.row .nm strong span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tagdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.cue { height: 28px; border-radius: 8px; border: 1px solid transparent; background: transparent; padding: 0 6px; margin-left: -6px; font-size: 12px; color: var(--muted); width: 100%; min-width: 0; }
.cue:hover, .cue:focus { border-color: var(--line2); background: var(--bg); }
.dose { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.dose select, .dose input[type=number] { height: 32px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg); padding: 0 6px; font-size: 12px; }
.dose input[type=number] { width: 62px; }
.dose .unit { font-size: 11px; color: var(--dim); min-width: 24px; }
.side-tog { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.side-tog input { accent-color: var(--amber); width: 15px; height: 15px; }
.acts { display: flex; gap: 2px; }
.sec { background: transparent; border: 0; padding: 14px 6px 2px; grid-template-columns: 22px minmax(0, 1fr) auto; }
.sec input { height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; font-family: var(--display); font-size: 19px; padding: 0 6px; margin-left: -6px; width: 100%; min-width: 0; }
.sec input:hover, .sec input:focus { border-color: var(--line2); background: var(--tile); }
.sec .kicker { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.restrow { background: transparent; border: 1px dashed var(--line2); }
.restrow .nm strong { color: var(--muted); }
.group { border-radius: 18px; border: 1px solid var(--amber-line); background: rgba(46, 36, 26, 0.55); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.group.target { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.g-head { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.g-head input.gname { height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; font-family: var(--display); font-size: 18px; padding: 0 6px; width: 100%; min-width: 0; }
.g-head input.gname:hover, .g-head input.gname:focus { border-color: var(--line2); background: var(--tile); }
.g-opts { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.g-opts input { width: 54px; height: 30px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg); padding: 0 6px; font-size: 12px; }
.g-kids { display: flex; flex-direction: column; gap: 6px; padding-left: 14px; }
.zone { border: 1px dashed var(--line2); border-radius: 12px; padding: 10px; font-size: 12px; color: var(--dim); text-align: center; }
.zone.end { padding: 16px; }
.drop-before::before, .drop-after::after { content: ""; position: absolute; left: 6px; right: 6px; height: 3px; border-radius: 2px; background: var(--amber); }
.drop-before::before { top: -5px; }
.drop-after::after { bottom: -5px; }
.zone.drop-in { border-color: var(--amber); color: var(--amber-soft); background: var(--amber-deep); }
.dragging { opacity: 0.4; }
.adders { display: flex; flex-wrap: wrap; gap: 8px; }
.target-note { font-size: 12px; color: var(--amber-soft); }

/* Week plan */
.plan { background: var(--surface); border: 1px solid #3A3129; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.plan p { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.plan-table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
td.day { font-family: var(--display); font-size: 18px; width: 70px; }
td select { width: 100%; height: 40px; border-radius: 12px; border: 1px solid var(--line2); background: var(--tile); padding: 0 10px; font-size: 13px; }
.now-badge { display: inline-block; margin-left: 6px; font-size: 10px; letter-spacing: 0.1em; padding: 2px 6px; border-radius: 6px; background: var(--amber); color: var(--on-amber); vertical-align: middle; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar"><div class="wrap bar-in" id="bar"></div></header>
<div class="wrap" id="helpwrap"></div>
<main class="wrap grid">
  <aside class="lib" aria-label="Move library">
    <div class="lib-head"><h2>Moves</h2><span id="libcount" class="num"></span></div>
    <input id="q" class="search" type="search" placeholder="Search moves" aria-label="Search moves" autocomplete="off">
    <div class="chips" id="filters" role="group" aria-label="Filter by type"></div>
    <div class="cards" id="cards"></div>
  </aside>
  <section aria-label="Programs" id="mainpane"></section>
</main>
<div id="pv" hidden></div>
<div id="toast" role="status" hidden></div>
<input id="openfile" type="file" accept=".json,application/json" hidden>

<script>
/* Ember shared data: move library, default programs, schedule, activities, and helpers.
   Used by both the Ember app and the Forge builder. */
(function (root) {
  'use strict';

  var TYPES = {
    yoga: { label: 'Yoga', color: '#C99BC0' },

    catcow: '<circle cx="10" cy="19" r="3.5"/><path d="M13 21Q24 12 35 21M15 22V38M33 22V38"/>',

  function figSVG(art, cls, stroke) {
    var f = FIG[art] || FIG.stand;
    return '<svg class="' + (cls || '') + '" viewBox="0 0 48 48" fill="none" stroke="' + (stroke || '#EBCB9F') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + f + '<path d="M4 42H44" stroke="#4A3E33"/></svg>';

  /* Move library. mode: hold (uses the hold setting unless secs set), time (secs), reps, tap (at your pace). */

  }
  var MOVES = [
    // Yoga
    mv('presence', 'Seated cross-legged', 'yoga', 'hold', null, false, 'Sit comfortably. Settle, breathe, and be present.', 'seated'),
    mv('catcow', 'Cat-cow', 'yoga', 'hold', null, false, 'Slow, with the breath.', 'catcow'),

    if (f === 'prog-name') { p.name = t.value; changed(false); updateProgChips(); return; }
    if (f === 'prog-rest') { p.restBetween = Math.max(0, Number(t.value) || 0); changed(false); return; }
    var path = t.dataset.path; if (path == null) return;
    var it = itemAt(path);
    if (f === 'name' || f === 'note') { it[f] = t.value; changed(false); return; }
    if (f === 'miles') { if (t.value !== '') it.miles = Math.max(0.25, Number(t.value)); changed(false); updateProgChips(); return; }
    if (f === 'secs' || f === 'reps' || f === 'rounds' || f === 'rest') {
      if (t.value === '') { if (f === 'secs' && it.k === 'move' && it.mode === 'hold') it.secs = null; }
      else it[f] = Math.max(f === 'rest' ? 0 : 1, Number(t.value));
      var mm = document.querySelector('[data-mm="' + path + '"]'); if (mm && f === 'secs') mm.textContent = Number(t.value) >= 60 ? E.mmss(Number(t.value)) : 'sec';
      changed(false); updateProgChips(); return;
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, f = t.dataset.f; if (!f) return;
    if (f === 'sched') { D.schedule[t.dataset.week][t.dataset.day] = t.value; changed(false); return; }
    var p = prog();
    if (f === 'prog-type') { p.type = t.value; changed(true); return; }
    var path = t.dataset.path; if (path == null) return;
    var it = itemAt(path);
    if (f === 'sides') { it.sides = t.checked; changed(false); updateProgChips(); return; }
    if (f === 'mode') {
      var m = E.MOVE[it.id] || {};
      it.mode = t.value;
      if (t.value === 'reps' && !it.reps) it.reps = m.reps || 10;
      if (t.value === 'time' && !it.secs) it.secs = m.secs || 60;
      if (t.value === 'hold') it.secs = null;
      if (t.value === 'dist' && !it.miles) it.miles = m.miles || 1;
      changed(true); return;
    }
  });
  function updateProgChips() {
    document.querySelectorAll('.prog-chip[data-id]').forEach(function (b) {
      var x = D.programs.find(function (q) { return q.id === b.dataset.id; }); if (!x) return;
      b.innerHTML = dot(x.type) + esc(x.name) + ' <small class="num">' + E.estimate(x, HOLD) + ' min</small>';
    });
  }
  document.getElementById('openfile').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { try { loadData(JSON.parse(r.result), 'Opened ' + f.name + '.'); } catch (e) { toast('That file couldn’t be read.'); } };
    r.readAsText(f); ev.target.value = '';
  });

  /* ---------- drag and drop ---------- */
  var drag = null, mark = null;
  // Rows become draggable only while the pointer is on their grip, so text inputs stay selectable.
  document.addEventListener('mouseover', function (ev) {
    var g = ev.target.closest && ev.target.closest('[data-grip]'); if (!g) return;
    var row = g.closest('[data-path]'); if (row) row.setAttribute('draggable', 'true');
  });
  var gripDown = false;
  document.addEventListener('mousedown', function (ev) { gripDown = !!(ev.target.closest && ev.target.closest('[data-grip]')); });
  document.addEventListener('mouseup', function () { gripDown = false; });
  document.addEventListener('mouseout', function (ev) {
    var g = ev.target.closest && ev.target.closest('[data-grip]'); if (!g || drag || gripDown) return;
    if (ev.relatedTarget && g.contains(ev.relatedTarget)) return;
    var row = g.closest('[data-path]'); if (row) row.removeAttribute('draggable');
  });
  document.addEventListener('dragstart', function (ev) {
    var c = ev.target.closest && ev.target.closest('[data-drag]');
    if (c) { drag = { src: c.dataset.drag }; ev.dataTransfer.effectAllowed = 'copy'; ev.dataTransfer.setData('text/plain', c.dataset.drag); return; }
    var row = ev.target.closest && ev.target.closest('[data-path][draggable="true"]');
    if (row) { drag = { src: 'item:' + row.dataset.path, el: row }; ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', 'item'); setTimeout(function () { row.classList.add('dragging'); }, 0); }
  });
  function clearMark() { if (mark) { mark.el.classList.remove('drop-before', 'drop-after', 'drop-in'); mark = null; } }
  function srcIsBig() {
    if (!drag) return false;
    if (drag.src.indexOf('prog:') === 0) return true;
    if (drag.src.indexOf('item:') === 0) { var it = itemAt(drag.src.slice(5)); return it.k === 'group' || it.k === 'section'; }
    return false;
  }
  function targetFor(ev) {
    var zone = ev.target.closest('[data-drop]'), row = ev.target.closest('#stack [data-path]');
    if (!zone && !row) return null;
    var big = srcIsBig();
    if (zone && (!row || row.contains(zone))) {
      var par = zone.dataset.drop;
      if (par !== '' && big) { return { parent: '', idx: Number(par) + 1, el: zone.closest('[data-path]'), cls: 'drop-after' }; }
      var lst = listAt(par); return { parent: par, idx: lst ? lst.length : 0, el: zone, cls: 'drop-in' };
    }
    var path = row.dataset.path, parts = path.split('.'), rect = row.getBoundingClientRect();
    if (row.classList.contains('group')) { var hd = row.querySelector('.g-head').getBoundingClientRect(); rect = { top: rect.top, height: (hd.bottom - rect.top) * 2 }; }
    var after = ev.clientY > rect.top + rect.height / 2;
    if (parts.length === 2 && big) { var gi = Number(parts[0]); return { parent: '', idx: gi + 1, el: row.closest('.group'), cls: 'drop-after' }; }
    var parent = parts.length === 2 ? parts[0] : '', idx = Number(parts[parts.length - 1]) + (after ? 1 : 0);
    return { parent: parent, idx: idx, el: row, cls: after ? 'drop-after' : 'drop-before' };
  }
  document.addEventListener('dragover', function (ev) {
    if (!drag) return;
    var tg = targetFor(ev); if (!tg) { clearMark(); return; }
    ev.preventDefault(); ev.dataTransfer.dropEffect = drag.src.indexOf('item:') === 0 ? 'move' : 'copy';
    if (!mark || mark.el !== tg.el || mark.cls !== tg.cls) { clearMark(); tg.el.classList.add(tg.cls); mark = tg; }
    mark.parent = tg.parent; mark.idx = tg.idx;
  });
  document.addEventListener('drop', function (ev) {
    if (!drag) return;
    var tg = targetFor(ev); ev.preventDefault(); clearMark();
    if (!tg) { drag = null; return; }
    var dst = listAt(tg.parent); if (!dst) { drag = null; return; }
    var p = prog(), idx = tg.idx;
    if (drag.src.indexOf('new:') === 0) { dst.splice(idx, 0, E.newItem(drag.src.slice(4))); if (tg.parent === '') fixTargetInsert(idx); }
    else if (drag.src.indexOf('prog:') === 0) {
      var src = D.programs.find(function (x) { return x.id === drag.src.slice(5); });
      if (src && src.id !== p.id) { var add = clone(src.items); Array.prototype.splice.apply(dst, [idx, 0].concat(add)); if (ui.target != null && ui.target >= idx) ui.target += add.length; }
    } else {
      var l = locate(drag.src.slice(5));
      var tgtGroup = ui.target != null ? p.items[ui.target] : null;
      var moving = l.list.splice(l.idx, 1)[0];
      if (dst === l.list && l.idx < idx) idx--;
      dst.splice(idx, 0, moving);
      ui.target = tgtGroup ? p.items.indexOf(tgtGroup) : null; if (ui.target < 0) ui.target = null;
    }
    drag = null; changed(true);
  });
  document.addEventListener("dragend", function () {
    gripDown = false;
    clearMark();
    document.querySelectorAll('[draggable="true"][data-path]').forEach(function (r) { r.removeAttribute('draggable'); r.classList.remove('dragging'); });
    drag = null;
  });

  /* ---------- boot ---------- */
  function boot(d) { D = d; ui.prog = D.programs[0] ? D.programs[0].id : null; render(); E.anim.start(); }
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { saved = null; }
  var pubP = fetchPublished();
  if (E.validData(saved)) { boot(saved); pubP.then(function () { renderBar(); }).catch(function () {}); }
  else { boot(E.defaultData()); pubP.then(function (d) { D = d; ui.prog = D.programs[0] ? D.programs[0].id : null; render(); }).catch(function () {}); }
  if (window.indexedDB && canPick) {
    idb('readonly', function (st) { return st.get('file'); }).then(function (h) {
      if (!h) return;
      fileHandle = h;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) { filePerm = p; renderBar(); });
    }).catch(function () {});
  }
})();
</script>
